<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cotoco · A ou B</title>
<meta name="description" content="Votação entre amigos: escolha A ou B e justifique o seu voto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estreita; a escolha A|B é um "duelo" lado a lado que vira empilhado no celular */
:root {
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --ink: #15172B;
  --muted: #5D6178;
  --line: #DADCE7;
  --a: #3B4CF0;
  --a-soft: #E4E7FF;
  --b: #F0632B;
  --b-soft: #FFE6DA;
  --danger: #C2283C;
  --ok: #18865B;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1020; --surface: #1A1C30; --ink: #EEF0FA; --muted: #A2A6C2; --line: #2E3150;
    --a: #8391FF; --a-soft: #262C66; --b: #FF8A5C; --b-soft: #4A2618;
    --danger: #FF7A8A; --ok: #4FD49A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1020; --surface: #1A1C30; --ink: #EEF0FA; --muted: #A2A6C2; --line: #2E3150;
  --a: #8391FF; --a-soft: #262C66; --b: #FF8A5C; --b-soft: #4A2618;
  --danger: #FF7A8A; --ok: #4FD49A; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
}
main { max-width: 680px; margin: 0 auto; display: grid; gap: 28px; }

.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); width: fit-content; }
.brand-mark { display: inline-flex; font: 800 15px/1 var(--display); border-radius: 8px; overflow: hidden; }
.brand-mark span { padding: 6px 8px; color: #fff; }
.brand-mark span:first-child { background: var(--a); }
.brand-mark span:last-child { background: var(--b); }
.brand-name { font: 700 18px/1 var(--display); letter-spacing: .01em; }

h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6.5vw, 44px); line-height: 1.08; font-weight: 800; }
h2 { font-size: 22px; line-height: 1.2; font-weight: 700; }
p { margin: 0; }
.lead { color: var(--muted); font-size: 17px; max-width: 60ch; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 18px; }

.field { display: grid; gap: 6px; }
label, .label { font-weight: 600; font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); }
input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
textarea { min-height: 120px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--a) 55%, transparent); outline-offset: 2px;
}
.ab-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tag { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font: 800 13px/1 var(--display); color: #fff; margin-right: 6px; vertical-align: -5px; }
.tag.A { background: var(--a); } .tag.B { background: var(--b); }

.btn {
  font: 600 16px/1 var(--body); border: 0; border-radius: 12px; padding: 15px 20px; cursor: pointer;
  background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.A { background: var(--a); color: #fff; } .btn.B { background: var(--b); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 10px 14px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; }

/* O duelo */
.duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 10px; }
.vs { align-self: center; font: 800 14px/1 var(--display); color: var(--muted); }
.choice {
  position: relative; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
  border: 2px solid var(--line); background: var(--surface); border-radius: 16px;
  padding: 18px 16px 20px; display: grid; gap: 10px; align-content: start; min-width: 0;
  transition: border-color .15s, background-color .15s, transform .15s;
}
.choice .letter { font: 800 44px/0.9 var(--display); }
.choice.A .letter { color: var(--a); } .choice.B .letter { color: var(--b); }
.choice .opt { font: 700 19px/1.25 var(--display); overflow-wrap: anywhere; }
.choice[aria-pressed="true"].A { border-color: var(--a); background: var(--a-soft); }
.choice[aria-pressed="true"].B { border-color: var(--b); background: var(--b-soft); }
.choice[aria-pressed="true"]::after {
  content: "Seu voto"; position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; color: #fff; padding: 4px 8px; border-radius: 99px;
}
.choice.A[aria-pressed="true"]::after { background: var(--a); }
.choice.B[aria-pressed="true"]::after { background: var(--b); }
.choice:hover { transform: translateY(-2px); }

.counter { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.error { color: var(--danger); font-size: 14px; font-weight: 500; }
.note { font-size: 14px; color: var(--muted); }

/* Placar */
.score { display: grid; gap: 12px; }
.score-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.score-side { display: grid; gap: 2px; min-width: 0; }
.score-side.right { text-align: right; }
.score-num { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.score-side.A .score-num { color: var(--a); } .score-side.B .score-num { color: var(--b); }
.score-label { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.bar { display: flex; height: 18px; border-radius: 99px; overflow: hidden; background: var(--line); }
.bar span { transition: width .5s ease; }
.bar .A { background: var(--a); } .bar .B { background: var(--b); }
.score-foot { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 600 14px/1 var(--body); padding: 9px 14px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.votes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.vote { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.vote.A { border-left-color: var(--a); } .vote.B { border-left-color: var(--b); }
.vote-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.vote-name { font-weight: 600; }
.vote-pick { font-size: 13px; font-weight: 600; }
.vote.A .vote-pick { color: var(--a); } .vote.B .vote-pick { color: var(--b); }
.vote-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.vote-time { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1.5px dashed var(--line); border-radius: 12px; }

.share { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.share code { flex: 1 1 220px; min-width: 0; font-size: 13px; padding: 11px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); overflow-x: auto; white-space: nowrap; user-select: all; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 500; }
.loading { color: var(--muted); }
footer { text-align: center; font-size: 13px; color: var(--muted); }

@media (max-width: 520px) {
  .duel { grid-template-columns: 1fr; }
  .vs { justify-self: center; }
  .ab-inputs { grid-template-columns: 1fr; }
  .panel { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<main id="app">
  <a class="brand" href="./" aria-label="Início">
    <span class="brand-mark" aria-hidden="true"><span>A</span><span>B</span></span>
    <span class="brand-name">Cotoco</span>
  </a>
  <p class="loading" id="boot">Carregando…</p>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---- Configuração do banco (chave pública: só permite ler e adicionar) ----
const SUPABASE_URL = "https://oojnqitywbasfxuispiw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vam5xaXR5d2Jhc2Z4dWlzcGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzYyNjgsImV4cCI6MjEwOTU1MjI2OH0.6qzzedJ5enwaJsoq4nag5inb-kC4Qq_QNQgVqeACtNc";

const MIN_JUST = 5, MAX_JUST = 600;

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: "return=representation",
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) { const err = new Error(data?.message || "Erro"); err.code = data?.code; err.status = res.status; throw err; }
  return data;
}

// ---- utilidades ----
const $ = (sel, root = document) => root.querySelector(sel);
const app = $("#app");
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : String(kid));
  return n;
}
function store(key, val) {
  try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch { return null; }
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2400);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Link copiado"); }
  catch { toast("Não deu para copiar. Selecione o link e copie."); }
}
function linkFor(id) { return `${location.origin}${location.pathname}?v=${id}`; }
function quando(iso) {
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return "agora";
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}
function clearView() { [...app.children].slice(1).forEach(n => n.remove()); }

// ---- Tela: criar votação ----
function viewCriar() {
  clearView();
  document.title = "Cotoco · A ou B";
  const err = el("p", { class: "error", role: "alert", hidden: true });
  const form = el("form", { class: "panel", novalidate: true },
    el("div", { class: "field" },
      el("label", { for: "pergunta" }, "Sobre o que é a votação?"),
      el("input", { type: "text", id: "pergunta", maxlength: 200, placeholder: "Ex.: Onde vai ser o churrasco de sábado?", required: true })),
    el("div", { class: "ab-inputs" },
      el("div", { class: "field" },
        el("label", { for: "opA" }, el("span", { class: "tag A" }, "A"), "Opção A"),
        el("input", { type: "text", id: "opA", maxlength: 80, placeholder: "Ex.: Na casa do Léo", required: true })),
      el("div", { class: "field" },
        el("label", { for: "opB" }, el("span", { class: "tag B" }, "B"), "Opção B"),
        el("input", { type: "text", id: "opB", maxlength: 80, placeholder: "Ex.: No sítio", required: true }))),
    err,
    el("button", { class: "btn", type: "submit" }, "Criar votação e pegar o link"));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pergunta = $("#pergunta").value.trim(), opcao_a = $("#opA").value.trim(), opcao_b = $("#opB").value.trim();
    if (pergunta.length < 3) return showErr("Escreva a pergunta da votação (pelo menos 3 letras).");
    if (!opcao_a || !opcao_b) return showErr("Preencha as duas opções, A e B.");
    const btn = form.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Criando…";
    try {
      const [v] = await api("cotoco_votacoes", { method: "POST", body: { pergunta, opcao_a, opcao_b } });
      store(`cotoco:criada:${v.id}`, true);
      history.pushState(null, "", `?v=${v.id}`);
      route();
    } catch {
      showErr("Não consegui criar a votação. Confira sua internet e tente de novo.");
      btn.disabled = false; btn.textContent = "Criar votação e pegar o link";
    }
  });
  function showErr(m) { err.textContent = m; err.hidden = false; }

  app.append(
    el("header", { style: "display:grid;gap:12px" },
      el("h1", {}, "Uma pergunta, duas opções e um porquê."),
      el("p", { class: "lead" }, "Crie a votação, mande o link no grupo e cada amigo escolhe A ou B. Ninguém vota sem justificar.")),
    form,
    el("footer", {}, "Qualquer pessoa com o link pode votar. Não precisa de cadastro."));
}

// ---- Tela: votação ----
let pollTimer = null;
async function viewVotacao(id) {
  clearView();
  const loading = el("p", { class: "loading" }, "Carregando a votação…");
  app.append(loading);

  let votacao;
  try {
    const rows = await api(`cotoco_votacoes?id=eq.${encodeURIComponent(id)}&select=*`);
    votacao = rows[0];
  } catch { votacao = null; }
  loading.remove();

  if (!votacao) {
    app.append(el("div", { class: "panel" },
      el("h2", {}, "Essa votação não foi encontrada"),
      el("p", { class: "note" }, "O link pode estar incompleto. Peça para quem criou mandar de novo."),
      el("a", { class: "btn ghost", href: "./" }, "Criar uma votação nova")));
    return;
  }
  document.title = `${votacao.pergunta} · Cotoco`;

  const meuVoto = () => store(`cotoco:voto:${id}`);
  const nomeSalvo = store("cotoco:nome") || "";
  let escolha = null, verResultados = !!meuVoto(), votos = [], filtro = "todos";

  const header = el("header", { style: "display:grid;gap:10px" },
    el("p", { class: "eyebrow" }, "Votação"),
    el("h1", {}, votacao.pergunta));

  // compartilhar
  const url = linkFor(id);
  const share = el("div", { class: "panel", style: "gap:10px" },
    el("p", { class: "label" }, store(`cotoco:criada:${id}`) ? "Pronto! Mande este link para a galera:" : "Link desta votação"),
    el("div", { class: "share" },
      el("code", {}, url),
      el("button", { class: "btn small", type: "button", onclick: () => copy(url) }, "Copiar link"),
      el("a", { class: "btn small ghost", href: `https://wa.me/?text=${encodeURIComponent(`Vota aí: ${votacao.pergunta}\n${url}`)}`, target: "_blank", rel: "noopener" }, "Mandar no WhatsApp")));

  // formulário de voto
  const cardA = el("button", { type: "button", class: "choice A", "aria-pressed": "false", onclick: () => escolher("A") },
    el("span", { class: "letter" }, "A"), el("span", { class: "opt" }, votacao.opcao_a));
  const cardB = el("button", { type: "button", class: "choice B", "aria-pressed": "false", onclick: () => escolher("B") },
    el("span", { class: "letter" }, "B"), el("span", { class: "opt" }, votacao.opcao_b));
  const nome = el("input", { type: "text", id: "nome", maxlength: 40, placeholder: "Como seus amigos te chamam", value: nomeSalvo, autocomplete: "given-name" });
  const just = el("textarea", { id: "justificativa", maxlength: MAX_JUST, placeholder: "Escolha uma opção acima e diga por que votou nela." });
  const counter = el("p", { class: "counter" });
  const err = el("p", { class: "error", role: "alert", hidden: true });
  const enviar = el("button", { class: "btn", type: "submit", disabled: true }, "Escolha A ou B");
  const justLabel = el("label", { for: "justificativa" }, "Por que você escolheu essa?");

  function escolher(op) {
    escolha = op;
    cardA.setAttribute("aria-pressed", op === "A"); cardB.setAttribute("aria-pressed", op === "B");
    justLabel.textContent = `Por que você escolheu ${op}?`;
    just.placeholder = `Conta pra galera por que ${op === "A" ? votacao.opcao_a : votacao.opcao_b} é a melhor escolha.`;
    atualizar();
  }
  function atualizar() {
    const n = just.value.trim().length;
    counter.textContent = n < MIN_JUST ? `Mínimo de ${MIN_JUST} caracteres (${n}/${MIN_JUST})` : `${n}/${MAX_JUST}`;
    const ok = escolha && nome.value.trim() && n >= MIN_JUST;
    enviar.disabled = !ok;
    enviar.className = "btn" + (escolha ? " " + escolha : "");
    enviar.textContent = !escolha ? "Escolha A ou B" : !nome.value.trim() ? "Coloque seu nome" : n < MIN_JUST ? "Justifique seu voto" : `Votar em ${escolha}`;
  }
  nome.addEventListener("input", atualizar); just.addEventListener("input", atualizar);

  const form = el("form", { class: "panel", novalidate: true },
    el("div", { class: "duel" }, cardA, el("span", { class: "vs", "aria-hidden": "true" }, "ou"), cardB),
    el("div", { class: "field" }, el("label", { for: "nome" }, "Seu nome"), nome),
    el("div", { class: "field" }, justLabel, just, counter),
    err,
    enviar,
    el("button", { type: "button", class: "linkbtn", onclick: () => { verResultados = true; render(); } }, "Ver os votos sem votar"));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = { votacao_id: id, nome: nome.value.trim(), escolha, justificativa: just.value.trim() };
    if (!escolha || !payload.nome || payload.justificativa.length < MIN_JUST) return;
    enviar.disabled = true; enviar.textContent = "Enviando…"; err.hidden = true;
    try {
      await api("cotoco_votos", { method: "POST", body: payload });
      store("cotoco:nome", payload.nome);
      store(`cotoco:voto:${id}`, { nome: payload.nome, escolha });
      verResultados = true;
      toast("Voto registrado!");
      await carregarVotos();
      render();
    } catch (ex) {
      err.textContent = ex.code === "23505"
        ? `Já existe um voto com o nome "${payload.nome}" nesta votação. Se não foi você, use outro nome (com sobrenome, por exemplo).`
        : "Não consegui registrar seu voto. Confira sua internet e tente de novo.";
      err.hidden = false; atualizar();
    }
  });

  // resultados
  const results = el("section", { style: "display:grid;gap:16px" });

  async function carregarVotos() {
    try { votos = await api(`cotoco_votos?votacao_id=eq.${id}&select=nome,escolha,justificativa,created_at&order=created_at.desc`); }
    catch { /* mantém os últimos votos na tela */ }
  }

  function renderResults() {
    results.replaceChildren();
    const a = votos.filter(v => v.escolha === "A").length, b = votos.length - a, total = votos.length;
    const pa = total ? Math.round((a / total) * 100) : 50, pb = total ? 100 - pa : 50;
    const mine = meuVoto();
    let resumo = total === 0 ? "Ninguém votou ainda." : a === b ? "Empate, por enquanto." : `${a > b ? "A" : "B"} está na frente.`;
    results.append(
      el("div", { class: "panel score" },
        el("div", { class: "score-head" },
          el("div", { class: "score-side A" }, el("span", { class: "score-num" }, a), el("span", { class: "score-label" }, `A · ${votacao.opcao_a}`)),
          el("div", { class: "score-side B right" }, el("span", { class: "score-num" }, b), el("span", { class: "score-label" }, `B · ${votacao.opcao_b}`))),
        el("div", { class: "bar", role: "img", "aria-label": `A ${pa}%, B ${pb}%` },
          el("span", { class: "A", style: `width:${total ? pa : 50}%` }), el("span", { class: "B", style: `width:${total ? pb : 50}%` })),
        el("p", { class: "score-foot" }, `${total} ${total === 1 ? "voto" : "votos"} · ${total ? `${pa}% A, ${pb}% B · ` : ""}${resumo}`),
        mine ? el("p", { class: "note" }, `Você votou como ${mine.nome}, na opção ${mine.escolha}.`) : null));

    const tabs = el("div", { class: "tabs", role: "tablist" },
      ...[["todos", `Todos (${total})`], ["A", `A (${a})`], ["B", `B (${b})`]].map(([k, t]) =>
        el("button", { type: "button", class: "tab", role: "tab", "aria-selected": String(filtro === k), onclick: () => { filtro = k; renderResults(); } }, t)));

    const lista = votos.filter(v => filtro === "todos" || v.escolha === filtro);
    results.append(
      el("div", { class: "row", style: "justify-content:space-between" }, el("h2", {}, "Justificativas"), tabs),
      lista.length
        ? el("ul", { class: "votes" }, lista.map(v => el("li", { class: `vote ${v.escolha}` },
            el("div", { class: "vote-head" },
              el("span", { class: "vote-name" }, v.nome),
              el("span", { class: "vote-pick" }, `${v.escolha} · ${v.escolha === "A" ? votacao.opcao_a : votacao.opcao_b}`)),
            el("p", { class: "vote-text" }, v.justificativa),
            el("span", { class: "vote-time" }, quando(v.created_at)))))
        : el("p", { class: "empty" }, total ? "Nenhum voto nesta opção ainda." : "Os votos e as justificativas aparecem aqui. Mande o link para a galera!"));
  }

  function render() {
    [...app.children].slice(1).forEach(n => n.remove());
    if (verResultados) {
      app.append(header, results, share);
      if (!meuVoto()) app.append(el("button", { type: "button", class: "btn ghost", onclick: () => { verResultados = false; render(); } }, "Quero votar"));
      renderResults();
    } else {
      app.append(header, form, share);
      atualizar();
    }
    app.append(el("footer", {}, el("a", { href: "./", style: "color:inherit" }, "Criar outra votação")));
  }

  await carregarVotos();
  render();
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden || !verResultados) return;
    await carregarVotos(); renderResults();
  }, 6000);
}

// ---- Roteamento ----
function route() {
  clearInterval(pollTimer);
  $("#boot")?.remove();
  const id = new URLSearchParams(location.search).get("v");
  if (id && /^[0-9a-f-]{36}$/i.test(id)) viewVotacao(id); else viewCriar();
}
window.addEventListener("popstate", route);
route();
</script>
</body>
</html>
